overlay: 1.0.0
info:
  title: API Evangelist enhancements for Ninox Public API
  version: 1.0.0
extends: openapi/ninox-public-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-rating: 4
    x-api-evangelist: https://apis.io/api-providers/ninox
    x-base-url: https://go.ninox.com
- target: $.servers
  update:
  - url: https://go.ninox.com
    description: Ninox public cloud
- target: $.info
  update:
    x-conventions:
      authentication: HTTP bearer, workspace API key (Authorization header)
      pagination: offset/limit with page_info.has_more
      error_envelope: '{ "error": { "message": string } }'
      versioning: URI path (/api/v1)
