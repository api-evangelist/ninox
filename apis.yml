aid: ninox
name: Ninox
description: >-
  Ninox is an AI-native low-code database and application platform that lets business teams
  build custom apps, databases, and workflows without traditional coding. Teams model data as
  modules, tables, fields, and records, automate processes with the Ninox scripting language,
  generate documents, and collaborate across organizations and workspaces. The Ninox Public
  REST API provides programmatic access to workspace resources — creating and managing modules,
  tables, fields, and records, plus CSV import — authenticated with per-workspace API keys sent
  as bearer tokens. Ninox is delivered as public cloud, private cloud, and on-premises
  deployments, and is backed by Techstars.
